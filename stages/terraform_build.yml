parameters:
  - name: TerraformBuildConfig
    type: object
    default: {}
    displayName: 'Terraform build configuration object (see docs/user-docs/jobs/terraform_build.md)'

  # DEPRECATED parameters: use the matching TerraformBuildConfig field instead. Passed through to
  # jobs/terraform_build.yml, which logs the deprecation warning and rejects a field set both ways.
  - name: ArtifactName
    type: string
    default: 'TerraformArtifact'
    displayName: 'DEPRECATED: use TerraformBuildConfig.ArtifactName'

  - name: RelativePathToTerraformFiles
    type: string
    default: ''
    displayName: 'DEPRECATED: use TerraformBuildConfig.RelativePathToTerraformFiles'

  - name: AdditionalFilesToPackage
    type: object
    default: [ ]
    displayName: 'DEPRECATED: use TerraformBuildConfig.AdditionalFilesToPackage'

  - name: TerraformVersion
    type: string
    default: '1.14.0'
    displayName: 'DEPRECATED: use TerraformBuildConfig.TerraformVersion'

  - name: TerraformBuildInjectionSteps
    type: stepList
    default: [ ]
    displayName: 'DEPRECATED: use TerraformBuildConfig.InjectionSteps'

stages:
  - stage: Build_Terraform
    displayName: "Build '${{ coalesce(parameters.TerraformBuildConfig.ArtifactName, parameters.ArtifactName) }}' Terraform"
    jobs:
      - template: /jobs/terraform_build.yml
        parameters:
          TerraformBuildConfig: ${{ parameters.TerraformBuildConfig }}
          ArtifactName: ${{ parameters.ArtifactName }}
          RelativePathToTerraformFiles: ${{ parameters.RelativePathToTerraformFiles }}
          AdditionalFilesToPackage: ${{ parameters.AdditionalFilesToPackage }}
          TerraformVersion: ${{ parameters.TerraformVersion }}
          TerraformBuildInjectionSteps: ${{ parameters.TerraformBuildInjectionSteps }}
