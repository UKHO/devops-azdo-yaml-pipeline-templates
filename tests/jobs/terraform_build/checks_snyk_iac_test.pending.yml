resources:
  repositories:
    - repository: AzDOPipelineTemplates
      type: github
      endpoint: UKHO
      name: UKHO/devops-azdo-yaml-pipeline-templates
      ref: ${{ variables['Build.SourceBranch'] }} # Build.SourceBranch doesn't work when you click 'Validate' must click the 'Download full YAML' button as it triggers a build

pool:
  name: 'Mare Nectaris'

trigger: none

pr:
  branches:
    include:
      - main
  drafts: false

# SnykIac on Terraform with no security issues.
# Expected result: the build job succeeds and the Snyk reports are attached to the run.
#
# PENDING: named *.pending.yml so cicd/ does not deploy it yet. Rename to *_test.yml once these exist:
#   - the UKHO Snyk extension installed in the organisation
#   - a Snyk Authentication service connection named 'Snyk', authorised for this pipeline
#   - a Snyk organisation for testing (replace 'snyk-test-org')
jobs:
  - template: jobs/terraform_build.yml@AzDOPipelineTemplates
    parameters:
      TerraformBuildConfig:
        TerraformVersion: 1.13.0
        RelativePathToTerraformFiles: tests/shared_resources/snyk_iac/clean
        Checks:
          - Check: SnykIac
            ServiceConnection: Snyk
            Organization: snyk-test-org
