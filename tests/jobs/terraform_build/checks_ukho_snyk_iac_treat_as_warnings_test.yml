resources:
  repositories:
    - repository: AzDOPipelineTemplates
      type: github
      endpoint: UKHO
      name: UKHO/devops-azdo-yaml-pipeline-templates
      ref: ${{ variables['Build.SourceBranch'] }} # Build.SourceBranch doesn't work when you click 'Validate' must click the 'Download full YAML' button as it triggers a build

pool:
  name: 'Mare Nectaris'

trigger: none

pr:
  branches:
    include:
      - main
  drafts: false

# UkhoSnykIac with TreatAsWarnings on Terraform with deliberate security issues. The scan fails, but the step
# uses continueOnError, so it's marked SucceededWithIssues and the job carries on to package and publish
# the artifact. The ValidateResults job proves the artifact was still published.
# Expected result: the run is "partially succeeded".
jobs:
  - template: jobs/terraform_build.yml@AzDOPipelineTemplates
    parameters:
      TerraformVersion: 1.13.0
      RelativePathToTerraformFiles: tests/shared_resources/snyk_iac/insecure
      Checks:
        - Check: UkhoSnykIac
          ServiceConnection: Snyk
          Organization: devops-chapter
          TreatAsWarnings: true

  - job: ValidateResults # SRJ: Ok this needs reworking to check that the UkhoSynkIac has successfully resulted in a warning and be successful///
    dependsOn:
      - TerraformBuild_TerraformArtifact
    steps:
      - template: tasks/download_pipeline_artifact.yml@AzDOPipelineTemplates
        parameters:
          ArtifactName: TerraformArtifact
