resources:
  repositories:
    - repository: AzDOPipelineTemplates
      type: github
      endpoint: UKHO
      name: UKHO/devops-azdo-yaml-pipeline-templates
      ref: ${{ variables['Build.SourceBranch'] }} # Build.SourceBranch doesn't work when you click 'Validate' must click the 'Download full YAML' button as it triggers a build

pool:
  name: 'Mare Nectaris'

trigger: none

pr:
  branches:
    include:
      - main
  drafts: false

# TerraformFormat listed twice with different Names, which must give unique step names
# (TerraformTask_fmt_RootOnly and TerraformTask_fmt_RootAgain).
# Expected result: the build job succeeds.
jobs:
  - template: jobs/terraform_build.yml@AzDOPipelineTemplates
    parameters:
      TerraformVersion: 1.13.0
      RelativePathToTerraformFiles: tests/shared_resources/terraform_format/unformatted_subfolder
      Checks:
        - Check: TerraformFormat
          Name: RootOnly
          Recursive: false
        - Check: TerraformFormat
          Name: RootAgain
          Recursive: false
