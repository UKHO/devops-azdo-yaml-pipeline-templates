resources:
  repositories:
    - repository: AzDOPipelineTemplates
      type: github
      endpoint: UKHO
      name: UKHO/devops-azdo-yaml-pipeline-templates
      ref: ${{ variables['Build.SourceBranch'] }} # Build.SourceBranch doesn't work when you click 'Validate' must click the 'Download full YAML' button as it triggers a build

pool:
  name: 'Mare Nectaris'

trigger: none

pr:
  branches:
    include:
      - main
  drafts: false

# TerraformFormat with TreatAsWarnings on a folder that is NOT formatted. 'terraform fmt -check' fails,
# but the step uses continueOnError, so it's marked SucceededWithIssues and the job carries on to package
# and publish the artifact. The ValidateResults job proves the artifact was still published.
# Expected result: the run is "partially succeeded".
#
# Note: confirm how "partially succeeded" is reported to the GitHub Status Check before relying on this
# pipeline as a required check.
jobs:
  - template: jobs/terraform_build.yml@AzDOPipelineTemplates
    parameters:
      TerraformBuildConfig:
        TerraformVersion: 1.13.0
        RelativePathToTerraformFiles: tests/shared_resources/terraform_format/unformatted
        Checks:
          - Check: TerraformFormat
            TreatAsWarnings: true

  - job: ValidateResults
    dependsOn:
      - TerraformBuild_TerraformArtifact
    steps:
      - template: tasks/download_pipeline_artifact.yml@AzDOPipelineTemplates
        parameters:
          ArtifactName: TerraformArtifact
