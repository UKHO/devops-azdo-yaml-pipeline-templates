parameters:
  - name: ArtifactName
    type: string
    default: DotNetArtifact
    displayName: Package artifact and job suffix
  - name: Condition
    type: string
    default: succeeded()
    displayName: Job condition
  - name: DependsOn
    type: object
    default: []
    displayName: Job dependencies
  - name: Pool
    type: string
    default: ''
    displayName: Optional agent pool name
  - name: DotNetBuildConfig
    type: object
    displayName: Solution or project and package requests
  - name: PreBuildChecks
    type: object
    default: []
    displayName: Ordered checks after restore
  - name: PostBuildChecks
    type: object
    default: []
    displayName: Ordered checks after compilation
  - name: Destinations
    type: object
    default: []
    displayName: Package destinations (defaults to PipelineArtifact)

jobs:
  - job: DotNetBuild_${{ parameters.ArtifactName }}
    displayName: Build ${{ parameters.ArtifactName }}
    dependsOn: ${{ parameters.DependsOn }}
    condition: ${{ parameters.Condition }}
    ${{ if parameters.Pool }}:
      pool: ${{ parameters.Pool }}
    workspace:
      clean: all
    variables:
      - name: DotNetSource
        value: $(Pipeline.Workspace)/dotnet-source
        readonly: true
      - name: DotNetTarget
        value: $(DotNetSource)/${{ parameters.DotNetBuildConfig.RelativePathToSolution }}
        readonly: true
      - name: DotNetConfiguration
        value: ${{ coalesce(parameters.DotNetBuildConfig.BuildConfiguration, 'Release') }}
        readonly: true
      - name: DotNetReports
        value: $(Build.ArtifactStagingDirectory)/reports
        readonly: true
      - name: DotNetPackages
        value: $(Build.ArtifactStagingDirectory)/packages
        readonly: true
    steps:
      - template: /schemas/dotnet_build.yml
        parameters:
          Config: ${{ parameters.DotNetBuildConfig }}
          Pre: ${{ parameters.PreBuildChecks }}
          Post: ${{ parameters.PostBuildChecks }}
          Destinations: ${{ parameters.Destinations }}
      - checkout: self
        clean: true
        path: dotnet-source
      - download: none
      - pwsh: |
          $null = New-Item -ItemType Directory -Force $env:DOTNETREPORTS
          $config = ConvertFrom-Json $env:CONFIG_JSON
          function Assert-SourceFile($path) {
            if (!$path -or [IO.Path]::IsPathRooted($path) -or $path -match '(^|[\\/])\.\.([\\/]|$)' -or !(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected an existing repository-relative file: '$path'"
            }
          }
          Assert-SourceFile $config.RelativePathToSolution
          if ($config.Restore.NuGetConfigPath) { Assert-SourceFile $config.Restore.NuGetConfigPath }
          foreach ($phase in 'PRE_JSON','POST_JSON') {
            foreach ($entry in (ConvertFrom-Json ([Environment]::GetEnvironmentVariable($phase)))) {
              if ($entry.Name -and $entry.Name -notmatch '^[A-Za-z0-9_]+$') { throw 'Invalid check Name' }
              if ($entry.Project) { Assert-SourceFile $entry.Project }
            }
          }
          $names = @{}
          foreach ($package in $config.Packages) {
            Assert-SourceFile $package.Project
            $name = if ($package.Name) { $package.Name } else { [IO.Path]::GetFileNameWithoutExtension($package.Project) }
            if ($name -notmatch '^[A-Za-z0-9_][A-Za-z0-9_.-]*$' -or $name.EndsWith('.') -or $names.ContainsKey($name)) { throw "Invalid or duplicate package name: $name" }
            $names[$name] = $true
          }
          if (!$config.DotNetSdk.Version -and !(Test-Path -LiteralPath global.json)) { throw 'Provide DotNetSdk.Version or a global.json at the repository root.' }
        displayName: Validate build inputs and initialise reports
        workingDirectory: $(DotNetSource)
        env:
          CONFIG_JSON: ${{ convertToJson(parameters.DotNetBuildConfig) }}
          PRE_JSON: ${{ convertToJson(parameters.PreBuildChecks) }}
          POST_JSON: ${{ convertToJson(parameters.PostBuildChecks) }}
      - ${{ if ne(lower(format('{0}', parameters.DotNetBuildConfig.DotNetSdk.Install)), 'false') }}:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              ${{ if parameters.DotNetBuildConfig.DotNetSdk.Version }}:
                version: ${{ parameters.DotNetBuildConfig.DotNetSdk.Version }}
              ${{ else }}:
                useGlobalJson: true
                workingDirectory: $(DotNetSource)
      - pwsh: |
          $sdk = dotnet --version
          if ($LASTEXITCODE) { throw 'The requested SDK is not available.' }
          if ($env:EXPECTED -and $sdk -ne $env:EXPECTED) { throw "Expected SDK $env:EXPECTED, resolved $sdk" }
          Set-Content -LiteralPath (Join-Path $env:DOTNETREPORTS sdk.txt) -Value $sdk
        displayName: Verify selected SDK
        workingDirectory: $(DotNetSource)
        env:
          EXPECTED: ${{ coalesce(parameters.DotNetBuildConfig.DotNetSdk.Version, '') }}
      - ${{ if parameters.DotNetBuildConfig.ConfigSources }}:
          - template: /utils/config_sources_task_list.yml
            parameters:
              ConfigSources: ${{ parameters.DotNetBuildConfig.ConfigSources }}
      - task: NuGetAuthenticate@1
      - pwsh: |
          $options = @("-p:Configuration=$env:DOTNETCONFIGURATION")
          $restore = if ($env:RESTORE_JSON) { ConvertFrom-Json $env:RESTORE_JSON }
          if ($restore.UseLockedMode -eq $true) { $options += '--locked-mode' }
          if ($restore.NuGetConfigPath) { $options += '--configfile', $restore.NuGetConfigPath }
          dotnet restore $env:DOTNETTARGET @options
        displayName: Restore
        workingDirectory: $(DotNetSource)
        env:
          RESTORE_JSON: ${{ convertToJson(parameters.DotNetBuildConfig.Restore) }}
      - ${{ each check in parameters.PreBuildChecks }}:
          - template: /checks/dotnetformat.yml
            parameters:
              WorkingDirectory: $(DotNetSource)
              ${{ each setting in check }}:
                ${{ if notIn(setting.key, 'Check', 'WorkingDirectory') }}:
                  ${{ setting.key }}: ${{ setting.value }}
      - pwsh: dotnet build $env:DOTNETTARGET --no-restore --configuration $env:DOTNETCONFIGURATION
        workingDirectory: $(DotNetSource)
        displayName: Build once
      - ${{ each check in parameters.PostBuildChecks }}:
          - template: /checks/dotnettest.yml
            parameters:
              WorkingDirectory: $(DotNetSource)
              ${{ each setting in check }}:
                ${{ if notIn(setting.key, 'Check', 'WorkingDirectory') }}:
                  ${{ setting.key }}: ${{ setting.value }}
      - ${{ if parameters.PostBuildChecks[0].Check }}:
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(DotNetReports)/**/coverage.cobertura.xml
              failIfCoverageEmpty: false
      - ${{ if parameters.DotNetBuildConfig.Packages[0].Type }}:
          - pwsh: |
              foreach ($package in (ConvertFrom-Json $env:PACKAGES_JSON)) {
                $name = if ($package.Name) { $package.Name } else { [IO.Path]::GetFileNameWithoutExtension($package.Project) }
                $argsList = @($package.Project, '--no-build', '--no-restore', '-c', $env:DOTNETCONFIGURATION)
                if ($package.Type -eq 'NuGet') {
                  dotnet pack @argsList -o (Join-Path $env:DOTNETPACKAGES nuget $name)
                } else {
                  $out = Join-Path $env:DOTNETPACKAGES publish $name
                  dotnet publish @argsList -o $out
                  if (!$LASTEXITCODE -and $package.ZipAfterPublish -ne $false) {
                    [IO.Compression.ZipFile]::CreateFromDirectory($out, "$out.zip")
                    Remove-Item -Recurse -LiteralPath $out
                  }
                }
                if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
            displayName: Package compiled output
            workingDirectory: $(DotNetSource)
            env:
              PACKAGES_JSON: ${{ convertToJson(parameters.DotNetBuildConfig.Packages) }}
      - pwsh: |
          $summary = Join-Path $env:DOTNETREPORTS summary.md
          $lines = @('### .NET build', "Job status before publication: $env:AGENT_JOBSTATUS")
          $entries = @(ConvertFrom-Json $env:PRE_JSON) + @(ConvertFrom-Json $env:POST_JSON)
          if (!$entries.Count) { $lines += 'No checks configured' }
          foreach ($entry in $entries) {
            $key = "$($entry.Check.ToLowerInvariant())_$($entry.Name)"
            $file = Join-Path $env:DOTNETREPORTS "$key.txt"
            $status = if (Test-Path -LiteralPath $file -PathType Leaf) { Get-Content -LiteralPath $file } else { 'Skipped or unavailable' }
            $lines += "- ${key}: $status"
          }
          Set-Content -LiteralPath $summary -Value $lines
          Write-Host "##vso[task.uploadsummary]$summary"
        condition: succeededOrFailed()
        displayName: Summarise checks
        env:
          PRE_JSON: ${{ convertToJson(parameters.PreBuildChecks) }}
          POST_JSON: ${{ convertToJson(parameters.PostBuildChecks) }}
      - task: PublishPipelineArtifact@1
        displayName: Publish available reports
        condition: succeededOrFailed()
        inputs:
          targetPath: $(DotNetReports)
          artifact: ${{ parameters.ArtifactName }}_Reports
      - ${{ if parameters.DotNetBuildConfig.Packages[0].Type }}:
          - template: /tasks/publish_pipeline_artifact.yml
            parameters:
              TargetPath: $(DotNetPackages)
              ArtifactName: ${{ parameters.ArtifactName }}
