parameters:
  - name: CheckoutAlias
    displayName: Resource alias for the repository containing this template (self for local templates)
    type: string
    default: AzDOPipelineTemplates
  - name: ArtifactName
    type: string
    default: DotNetArtifact
    displayName: Package artifact and job suffix
  - name: Condition
    type: string
    default: succeeded()
    displayName: Job condition
  - name: DependsOn
    type: object
    default: []
    displayName: Job dependencies
  - name: Pool
    type: string
    default: ''
    displayName: Optional agent pool name
  - name: DotNetBuildConfig
    type: object
    displayName: Solution or project and package requests
  - name: PreBuildChecks
    type: object
    default: []
    displayName: Ordered checks after restore
  - name: PostBuildChecks
    type: object
    default: []
    displayName: Ordered checks after compilation
  - name: Destinations
    type: object
    default: []
    displayName: Package destinations (defaults to PipelineArtifact)

jobs:
  - job: DotNetBuild_${{ parameters.ArtifactName }}
    displayName: Build ${{ parameters.ArtifactName }}
    dependsOn: ${{ parameters.DependsOn }}
    condition: ${{ parameters.Condition }}
    ${{ if parameters.Pool }}:
      pool: ${{ parameters.Pool }}
    workspace:
      clean: all
    variables:
      - name: DotNetSource
        value: $(Pipeline.Workspace)/dotnet-source
        readonly: true
      - name: DotNetScriptRoot
        ${{ if eq(parameters.CheckoutAlias, 'self') }}:
          value: $(DotNetSource)/scripts/dotnet
        ${{ else }}:
          value: $(Pipeline.Workspace)/dotnet-templates/scripts/dotnet
        readonly: true
      - name: DotNetTarget
        value: $(DotNetSource)/${{ parameters.DotNetBuildConfig.RelativePathToSolution }}
        readonly: true
      - name: DotNetConfiguration
        value: ${{ coalesce(parameters.DotNetBuildConfig.BuildConfiguration, 'Release') }}
        readonly: true
      - name: DotNetReports
        value: $(Build.ArtifactStagingDirectory)/reports
        readonly: true
      - name: DotNetPackages
        value: $(Build.ArtifactStagingDirectory)/packages
        readonly: true
    steps:
      - template: /schemas/dotnet_build.yml
        parameters:
          Config: ${{ parameters.DotNetBuildConfig }}
          Pre: ${{ parameters.PreBuildChecks }}
          Post: ${{ parameters.PostBuildChecks }}
          Destinations: ${{ parameters.Destinations }}
      - checkout: self
        clean: true
        path: dotnet-source
      - ${{ if ne(parameters.CheckoutAlias, 'self') }}:
          - checkout: ${{ parameters.CheckoutAlias }}
            path: dotnet-templates
            fetchDepth: 1
            clean: true
      - download: none
      - task: PowerShell@2
        inputs:
          targetType: filePath
          pwsh: true
          filePath: $(DotNetScriptRoot)/validate_inputs.ps1
          workingDirectory: $(DotNetSource)
        displayName: Validate build inputs and initialise reports
        env:
          CONFIG_JSON: ${{ convertToJson(parameters.DotNetBuildConfig) }}
          PRE_JSON: ${{ convertToJson(parameters.PreBuildChecks) }}
          POST_JSON: ${{ convertToJson(parameters.PostBuildChecks) }}
      - ${{ if ne(lower(format('{0}', parameters.DotNetBuildConfig.DotNetSdk.Install)), 'false') }}:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              ${{ if parameters.DotNetBuildConfig.DotNetSdk.Version }}:
                version: ${{ parameters.DotNetBuildConfig.DotNetSdk.Version }}
              ${{ else }}:
                useGlobalJson: true
                workingDirectory: $(DotNetSource)
      - task: PowerShell@2
        inputs:
          targetType: filePath
          pwsh: true
          filePath: $(DotNetScriptRoot)/verify_sdk.ps1
          workingDirectory: $(DotNetSource)
        displayName: Verify selected SDK
        env:
          EXPECTED: ${{ coalesce(parameters.DotNetBuildConfig.DotNetSdk.Version, '') }}
      - ${{ if parameters.DotNetBuildConfig.ConfigSources }}:
          - template: /utils/config_sources_task_list.yml
            parameters:
              ConfigSources: ${{ parameters.DotNetBuildConfig.ConfigSources }}
      - task: NuGetAuthenticate@1
      - task: DotNetCoreCLI@2
        displayName: Restore
        inputs:
          # Keep ordinary NuGet config discovery; the dedicated restore mode generates a config.
          command: custom
          custom: restore
          projects: $(DotNetTarget)
          workingDirectory: $(DotNetSource)
          arguments: >-
            -p:Configuration="$(DotNetConfiguration)"
            ${{ iif(eq(parameters.DotNetBuildConfig.Restore.UseLockedMode, true), '--locked-mode', '') }}
            ${{ iif(parameters.DotNetBuildConfig.Restore.NuGetConfigPath, format('--configfile "$(DotNetSource)/{0}"', parameters.DotNetBuildConfig.Restore.NuGetConfigPath), '') }}
      - ${{ each check in parameters.PreBuildChecks }}:
          - template: /checks/dotnetformat.yml
            parameters:
              WorkingDirectory: $(DotNetSource)
              ${{ each setting in check }}:
                ${{ if notIn(setting.key, 'Check', 'WorkingDirectory') }}:
                  ${{ setting.key }}: ${{ setting.value }}
      - task: DotNetCoreCLI@2
        displayName: Build once
        inputs:
          command: build
          projects: $(DotNetTarget)
          workingDirectory: $(DotNetSource)
          arguments: --no-restore --configuration "$(DotNetConfiguration)"
      - ${{ each check in parameters.PostBuildChecks }}:
          - template: /checks/dotnettest.yml
            parameters:
              WorkingDirectory: $(DotNetSource)
              ${{ each setting in check }}:
                ${{ if notIn(setting.key, 'Check', 'WorkingDirectory') }}:
                  ${{ setting.key }}: ${{ setting.value }}
      - ${{ if parameters.PostBuildChecks[0].Check }}:
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(DotNetReports)/**/coverage.cobertura.xml
              failIfCoverageEmpty: false
      - ${{ each package in parameters.DotNetBuildConfig.Packages }}:
          - ${{ if not(package.Name) }}:
              - task: PowerShell@2
                displayName: Resolve default package name for ${{ package.Project }}
                inputs:
                  targetType: filePath
                  pwsh: true
                  filePath: $(DotNetScriptRoot)/resolve_package_name.ps1
                env:
                  PACKAGE_PROJECT: ${{ package.Project }}
          - ${{ if eq(package.Type, 'NuGet') }}:
              - task: DotNetCoreCLI@2
                displayName: Pack ${{ package.Project }}
                inputs:
                  command: pack
                  packagesToPack: $(DotNetSource)/${{ package.Project }}
                  configuration: $(DotNetConfiguration)
                  nobuild: true
                  versioningScheme: 'off'
                  packDirectory: $(DotNetPackages)/nuget/${{ coalesce(package.Name, '$(DotNetDefaultPackageName)') }}
          - ${{ else }}:
              - task: DotNetCoreCLI@2
                displayName: Publish ${{ package.Project }}
                inputs:
                  command: publish
                  workingDirectory: $(DotNetSource)
                  publishWebProjects: false
                  projects: $(DotNetSource)/${{ package.Project }}
                  modifyOutputPath: false
                  zipAfterPublish: false
                  arguments: >-
                    --no-build --no-restore -c "$(DotNetConfiguration)"
                    --output "${{ iif(eq(lower(format('{0}', package.ZipAfterPublish)), 'false'), '$(DotNetPackages)/publish', '$(Build.ArtifactStagingDirectory)/zip-input') }}/${{ coalesce(package.Name, '$(DotNetDefaultPackageName)') }}"
              - ${{ if ne(lower(format('{0}', package.ZipAfterPublish)), 'false') }}:
                  - task: ArchiveFiles@2
                    displayName: Archive ${{ package.Project }}
                    inputs:
                      rootFolderOrFile: $(Build.ArtifactStagingDirectory)/zip-input/${{ coalesce(package.Name, '$(DotNetDefaultPackageName)') }}
                      includeRootFolder: false
                      archiveType: zip
                      archiveFile: $(DotNetPackages)/publish/${{ coalesce(package.Name, '$(DotNetDefaultPackageName)') }}.zip
      - task: PowerShell@2
        inputs:
          targetType: filePath
          pwsh: true
          filePath: $(DotNetScriptRoot)/write_summary.ps1
        condition: succeededOrFailed()
        displayName: Summarise checks
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          PRE_JSON: ${{ convertToJson(parameters.PreBuildChecks) }}
          POST_JSON: ${{ convertToJson(parameters.PostBuildChecks) }}
      - task: PublishPipelineArtifact@1
        displayName: Publish available reports
        condition: succeededOrFailed()
        inputs:
          targetPath: $(DotNetReports)
          artifact: ${{ parameters.ArtifactName }}_Reports
      - ${{ if parameters.DotNetBuildConfig.Packages[0].Type }}:
          - template: /tasks/publish_pipeline_artifact.yml
            parameters:
              TargetPath: $(DotNetPackages)
              ArtifactName: ${{ parameters.ArtifactName }}
