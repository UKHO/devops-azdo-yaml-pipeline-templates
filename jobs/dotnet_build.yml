# Job Template: dotnet_build
#
# Purpose:
#   Builds and (optionally) tests a .NET application, then packages the output either as a
#   zip artifact published to the pipeline, or as a container image built and pushed to a
#   container registry.
#
# Parameters:
#   - ArtifactName (string, optional): Name of the artifact/job suffix. Default: 'DotNetArtifact'
#   - Condition (string, optional): The condition that controls whether this job runs. Default: succeeded()
#   - DependsOn (object, optional): List of jobs this job depends on. Default: []
#   - Pool (string, optional): The pool that this job will run on. Default: ''
#   - DotNetBuildInjectionSteps (stepList, optional): Steps to be carried out before the .NET
#     project is restored, built, tested, and packaged. Default: []
#   - DotNetBuildConfig (object, required): .NET build configuration object
#     (see docs/definition_docs/dotnet_pipeline/dotnet_build_config.md)
#
# Example Usage:
#   # Build, test, and publish as a zip artifact
#   - template: jobs/dotnet_build.yml
#     parameters:
#       ArtifactName: 'MyApiArtifact'
#       DotNetBuildConfig:
#         RelativePathToProject: 'src/MyApi/MyApi.csproj'
#         BuildOutputType: Zip
#
#   # Build, test, and publish as a container image
#   - template: jobs/dotnet_build.yml
#     parameters:
#       ArtifactName: 'MyApiImage'
#       DotNetBuildConfig:
#         RelativePathToProject: 'src/MyApi/MyApi.csproj'
#         BuildOutputType: Container
#         ContainerRegistryServiceConnection: 'MyAcrServiceConnection'
#         ContainerRepository: 'myregistry.azurecr.io/my-api'
#
# Notes:
#   - See docs/definition_docs/dotnet_pipeline/dotnet_build_config.md for the full set of
#     DotNetBuildConfig properties and validation rules.

parameters:
  - name: ArtifactName
    type: string
    default: 'DotNetArtifact'
    displayName: 'Artifact Name for Target Path to be saved as'

  - name: Condition
    type: string
    default: succeeded()
    displayName: 'The condition that will control whether this job runs or not'

  - name: DependsOn
    type: object
    default: [ ]
    displayName: 'List of jobs this job depends on'

  - name: Pool
    type: string
    default: ''
    displayName: 'The pool that this job will run on'

  - name: DotNetBuildInjectionSteps
    type: stepList
    default: [ ]
    displayName: 'Steps to be carried out before the .NET project is restored, built, tested, and packaged'

  - name: DotNetBuildConfig
    type: object
    # NO default - Consumer must provide this
    displayName: '.NET build configuration object (see docs/definition_docs/dotnet_pipeline/dotnet_build_config.md)'

jobs:
  - template: /schemas/dotnet_build_config.yml
    parameters:
      DotNetBuildConfig: ${{ parameters.DotNetBuildConfig }}
      ArtifactName: ${{ parameters.ArtifactName }}

  - job: DotNetBuild_${{ parameters.ArtifactName }}
    displayName: "Build '${{ parameters.ArtifactName }}' .NET Artifact"

    condition: ${{ parameters.Condition }}
    dependsOn: ${{ parameters.DependsOn }}
    ${{ if parameters.Pool }}:
      pool: ${{ parameters.Pool }}
    workspace:
      clean: all

    variables:
      RepositoryCheckoutFolderName: $(Build.Repository.Name)
      RepositoryDirectory: $(Pipeline.Workspace)/$(RepositoryCheckoutFolderName)
      DotNetProjectPath: $(RepositoryDirectory)/${{ parameters.DotNetBuildConfig.RelativePathToProject }}
      DotNetBuildConfiguration: ${{ iif(ne(parameters.DotNetBuildConfig.BuildConfiguration, ''), parameters.DotNetBuildConfig.BuildConfiguration, 'Release') }}
      DotNetPublishOutputDirectory: ${{ iif(ne(parameters.DotNetBuildConfig.PublishOutputDirectory, ''), parameters.DotNetBuildConfig.PublishOutputDirectory, '$(Build.ArtifactStagingDirectory)/publish') }}

    steps:
      - checkout: self
        displayName: 'Checkout self repository'
        clean: true
        path: $(RepositoryCheckoutFolderName)

      - download: none

      - ${{ each step in parameters.DotNetBuildInjectionSteps }}:
          - ${{ step }}

      - ${{ if parameters.DotNetBuildConfig.DotNetVersion }}:
          - template: /tasks/dotnet_installer.yml
            parameters:
              DotNetVersion: ${{ parameters.DotNetBuildConfig.DotNetVersion }}

      - template: /tasks/dotnet_cli.yml
        parameters:
          Command: restore
          Projects: $(DotNetProjectPath)

      - template: /tasks/dotnet_cli.yml
        parameters:
          Command: build
          Projects: $(DotNetProjectPath)
          Arguments: '--configuration $(DotNetBuildConfiguration) --no-restore'

      - ${{ if ne(string(parameters.DotNetBuildConfig.RunTests), 'False') }}:
          - template: /tasks/dotnet_cli.yml
            parameters:
              Command: test
              Projects: ${{ iif(ne(parameters.DotNetBuildConfig.TestProjects, ''), parameters.DotNetBuildConfig.TestProjects, '$(DotNetProjectPath)') }}
              Arguments: '--configuration $(DotNetBuildConfiguration) --no-build'
              PublishTestResults: ${{ iif(ne(string(parameters.DotNetBuildConfig.PublishTestResults), 'False'), true, false) }}

      - ${{ if eq(parameters.DotNetBuildConfig.BuildOutputType, 'Zip') }}:
          - template: /tasks/dotnet_cli.yml
            parameters:
              Command: publish
              Projects: $(DotNetProjectPath)
              Arguments: '--configuration $(DotNetBuildConfiguration) --no-build --output $(DotNetPublishOutputDirectory) --property:UseAppHost=false'

          - template: /tasks/publish_pipeline_artifact.yml
            parameters:
              ArtifactName: ${{ parameters.ArtifactName }}
              TargetPath: $(DotNetPublishOutputDirectory)

      - ${{ if eq(parameters.DotNetBuildConfig.BuildOutputType, 'Container') }}:
          - template: /tasks/docker.yml
            parameters:
              ContainerRegistryServiceConnection: ${{ parameters.DotNetBuildConfig.ContainerRegistryServiceConnection }}
              Repository: ${{ parameters.DotNetBuildConfig.ContainerRepository }}
              Command: buildAndPush
              Dockerfile: ${{ iif(ne(parameters.DotNetBuildConfig.Dockerfile, ''), parameters.DotNetBuildConfig.Dockerfile, '**/Dockerfile') }}
              BuildContext: ${{ iif(ne(parameters.DotNetBuildConfig.BuildContext, ''), parameters.DotNetBuildConfig.BuildContext, '.') }}
              Tags: ${{ iif(ne(parameters.DotNetBuildConfig.ImageTags, ''), parameters.DotNetBuildConfig.ImageTags, '$(Build.BuildId)') }}
