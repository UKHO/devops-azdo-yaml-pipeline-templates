parameters:
  - name: JobName
    type: string
    default: ManualVerification
    displayName: 'Name of the job'

  - name: Condition
    type: string
    default: succeeded()
    displayName: 'Condition to run the job'

  - name: DependsOn
    type: object
    default: [ ]
    displayName: 'List of jobs this job depends on'

  - name: OnTimeoutBehaviour
    type: string
    default: 'reject'
    values: [ reject, resume ]
    displayName: 'Action to take when validation times out (reject or resume)'

  - name: TimeoutInMinutes
    type: number
    default: 60
    displayName: 'Timeout for manual verification (minutes)'

  - name: Instructions
    type: string
    default: ''
    displayName: 'Instructions shown to users for manual validation decision'

  - name: ManualVerificationConfig
    type: object
    default: { }
    displayName: 'Optional manual verification configuration object. Fields provided here take precedence over the individual OnTimeoutBehaviour/TimeoutInMinutes/Instructions parameters above (see docs/definition_docs/terraform_pipeline/manual_verification_config.md)'

jobs:
  # NOTE: this validation call is unconditional - an empty object ({}) is a valid "not configured"
  # state and is a no-op inside the schema; wrapping this in a truthy-check on the object itself would
  # be misleading here since an empty object is truthy in template expressions.
  - template: /schemas/manual_verification_config.yml
    parameters:
      ManualVerificationConfig: ${{ parameters.ManualVerificationConfig }}
      ContextName: ${{ parameters.JobName }}

  - job: ${{ parameters.JobName }}
    condition: ${{ parameters.Condition }}
    dependsOn: ${{ parameters.DependsOn }}
    pool: server
    displayName: 'Manual Verification'
    steps:
      - template: /tasks/delay.yml

      - template: /tasks/manual_validation.yml
        parameters:
          OnTimeoutBehaviour: ${{ coalesce(parameters.ManualVerificationConfig.OnTimeoutBehaviour, parameters.OnTimeoutBehaviour) }}
          TimeoutInMinutes: ${{ coalesce(parameters.ManualVerificationConfig.TimeoutInMinutes, parameters.TimeoutInMinutes) }}
          Instructions: ${{ coalesce(parameters.ManualVerificationConfig.Instructions, parameters.Instructions) }}
