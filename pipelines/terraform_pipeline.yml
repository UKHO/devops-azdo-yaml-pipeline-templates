parameters:
  - name: TerraformVersion
    type: string
    default: '1.14.0'
    displayName: 'Version of Terraform CLI tool to use with the terraform files (shared by the build and deploy stages)'

  - name: TerraformBuildConfig
    type: object
    default: {}
    displayName: 'Terraform build configuration object, without ArtifactName and TerraformVersion (see docs/user-docs/pipelines/terraform_pipeline.md)'

  # DEPRECATED parameters: use the matching TerraformBuildConfig field instead.
  - name: RelativePathToTerraformFiles
    type: string
    default: ''
    displayName: 'DEPRECATED: use TerraformBuildConfig.RelativePathToTerraformFiles'

  - name: AdditionalFilesToPackage
    type: object
    default: [ ]
    displayName: 'DEPRECATED: use TerraformBuildConfig.AdditionalFilesToPackage'

  - name: TerraformBuildInjectionSteps
    type: stepList
    default: [ ]
    displayName: 'DEPRECATED: use TerraformBuildConfig.InjectionSteps'

  - name: EnvironmentConfigs
    type: object
    # NO default - Consumer must provide this
    displayName: 'List of environment configurations (see docs/definition_docs/terraform_pipeline/environment_config.md)'

stages:
  - template: /stages/terraform_build.yml
    parameters:
      # The deploy stages use the pipeline's TerraformVersion and the default artifact name, so the build
      # must too: these two fields can't be set in TerraformBuildConfig at pipeline level.
      ${{ if contains(convertToJson(parameters.TerraformBuildConfig), '"TerraformVersion"') }}:
        "Invalid TerraformBuildConfig: 'TerraformVersion' is not supported by terraform_pipeline. Set the pipeline's TerraformVersion parameter instead, which is shared by the build and deploy stages.": "Error"
      ${{ if contains(convertToJson(parameters.TerraformBuildConfig), '"ArtifactName"') }}:
        "Invalid TerraformBuildConfig: 'ArtifactName' is not supported by terraform_pipeline, because the deploy stages always use the artifact 'TerraformArtifact'.": "Error"
      TerraformBuildConfig:
        ${{ each field in parameters.TerraformBuildConfig }}:
          ${{ field.key }}: ${{ field.value }}
        ${{ if not(contains(convertToJson(parameters.TerraformBuildConfig), '"TerraformVersion"')) }}:
          TerraformVersion: ${{ parameters.TerraformVersion }}
      RelativePathToTerraformFiles: ${{ parameters.RelativePathToTerraformFiles }}
      AdditionalFilesToPackage: ${{ parameters.AdditionalFilesToPackage }}
      TerraformBuildInjectionSteps: ${{ parameters.TerraformBuildInjectionSteps }}

  - ${{ each environmentConfig in parameters.EnvironmentConfigs }}:
      - template: /stages/terraform_deploy.yml
        parameters:
          ${{ if or(not(environmentConfig.Name), eq(environmentConfig.Name, '')) }}:
            "an environment name is not properly defined and is a required field.": "Error"
          TerraformVersion: ${{ parameters.TerraformVersion }}
          EnvironmentConfig: ${{ environmentConfig }}
