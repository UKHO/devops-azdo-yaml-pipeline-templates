# DotNetTest: execute previously compiled VSTest projects.
# WorkingDirectory: job-owned source root. Name (string, '') labels this instance.
# TreatAsWarnings (boolean, false); Project (string, '' = build target);
# Filter (string, '' = all); TestRunTitle (string, '' = instance or target);
# CollectCoverage (boolean, true) requests a project-provided XPlat collector.
parameters:
  - name: WorkingDirectory
    type: string
    displayName: Job-owned source root
  - name: Name
    type: string
    displayName: Instance label
    default: ''
  - name: TreatAsWarnings
    type: boolean
    displayName: Treat check failures as warnings
    default: false
  - name: Project
    type: string
    displayName: Built solution or test project
    default: ''
  - name: Filter
    type: string
    displayName: VSTest filter
    default: ''
  - name: TestRunTitle
    type: string
    displayName: Tests tab title
    default: ''
  - name: CollectCoverage
    type: boolean
    displayName: Collect Cobertura coverage
    default: true
steps:
  - task: PowerShell@2
    inputs:
      targetType: filePath
      pwsh: true
      filePath: $(DotNetScriptRoot)/check_tests.ps1
      workingDirectory: ${{ parameters.WorkingDirectory }}
    name: PostTest_${{ parameters.Name }}
    displayName: Run tests ${{ parameters.Name }}
    continueOnError: ${{ parameters.TreatAsWarnings }}
    env:
      TEST_PROJECT: ${{ coalesce(parameters.Project, '$(DotNetTarget)') }}
      TEST_FILTER: ${{ parameters.Filter }}
      INSTANCE: dotnettest_${{ parameters.Name }}
      COVERAGE: ${{ format('{0}', parameters.CollectCoverage) }}
      WARN: ${{ format('{0}', parameters.TreatAsWarnings) }}
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      searchFolder: $(DotNetReports)
      testResultsFiles: dotnettest_${{ parameters.Name }}/**/*.trx
      testRunTitle: ${{ coalesce(parameters.TestRunTitle, parameters.Name, parameters.Project, '$(DotNetTarget)') }}
