# Schema Template: Terraform Gated Destroy Config
# Validates the terraform destroy configuration properties used directly by
# jobs/terraform_gated_destroy.yml (RunMode and verification timeout fields).
# AzDOEnvironmentName is also validated here (duplicated from
# schemas/terraform_destroy_config.yml) so that a consumer calling this job
# directly gets a clear, standalone error rather than a confusing downstream
# failure. All other fields (BackendConfig, VariableFiles, etc.) are validated
# by schemas/terraform_destroy_config.yml, which this job's downstream call to
# jobs/terraform_destroy.yml runs on its own.
# See: docs/definition_docs/terraform_pipeline/terraform_job_config.md

parameters:
  - name: TerraformDestroyConfig
    type: object
    # NO default - Consumer must provide this
    displayName: 'Terraform destroy configuration object (see docs/definition_docs/terraform_pipeline/terraform_job_config.md) (required)'

  - name: EnvironmentName
    type: string
    # NO default - Consumer must provide this
    displayName: 'The environment name that the infrastructure is for'

jobs:
  - ${{ if or(not(parameters.TerraformDestroyConfig.AzDOEnvironmentName), eq(parameters.TerraformDestroyConfig.AzDOEnvironmentName, '')) }}:
      - "'${{ parameters.EnvironmentName }}' environment error: AzDOEnvironmentName is not properly defined and is a required field.": "Error"

  - ${{ if or(not(parameters.TerraformDestroyConfig.RunMode), eq(parameters.TerraformDestroyConfig.RunMode, '')) }}:
      - "'${{ parameters.EnvironmentName }}' environment error: RunMode is not properly defined and is a required field. Must be a valid option (PlanVerifyDestroy, PlanOnly, DestroyOnly).": "Error"
  - ${{ else }}:
      - ${{ if notIn(parameters.TerraformDestroyConfig.RunMode, 'PlanVerifyDestroy', 'PlanOnly', 'DestroyOnly') }}:
          - "'${{ parameters.EnvironmentName }}' environment error: RunMode must be a valid option (PlanVerifyDestroy, PlanOnly, DestroyOnly).": "Error"

  - ${{ if contains(convertToJson(parameters.TerraformDestroyConfig), '"VerificationTimeoutBehaviour"') }}:
      - ${{ if notIn(parameters.TerraformDestroyConfig.VerificationTimeoutBehaviour, 'reject', 'resume') }}:
          - "'${{ parameters.EnvironmentName }}' environment error: VerificationTimeoutBehaviour must be either 'reject' or 'resume'.": "Error"

  - ${{ if contains(convertToJson(parameters.TerraformDestroyConfig), '"VerificationTimeoutInMinutes"') }}:
      - ${{ if or(lt(parameters.TerraformDestroyConfig.VerificationTimeoutInMinutes, 1), gt(parameters.TerraformDestroyConfig.VerificationTimeoutInMinutes, 43200)) }}:
          - "'${{ parameters.EnvironmentName }}' environment error: VerificationTimeoutInMinutes must be a number between 1 and 43200 (30 days).": "Error"
