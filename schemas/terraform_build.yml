# Schema Template: Terraform Build
# Validates the `Checks` entries for jobs/terraform_build.yml.
# Interim schema: a later TerraformBuildConfig refactor will bring this job in line with the other config schemas.
# See: docs/user-docs/checks/README.md
#
# Validates the list and each entry's 'Check' and 'Name' fields only. Each check's own settings are
# validated by the check template itself (checks/<name>.yml) through its typed parameters.
#
# Counting entries: template expressions have no counter or loop index, so this schema counts how often a
# field value appears in the whole list. It splits the list's JSON on the field, for example
# '"check": "terraformformat"'. Splitting on a value that appears N times gives N + 1 pieces, so more than
# 2 pieces means the value appears more than once. Both sides are lower-cased, because Azure DevOps
# compares check names and step names without regard to case. The space after the colon is passed in as
# format() argument {0}, because YAML does not allow a colon followed by a space inside an unquoted key.

parameters:
  - name: Checks
    type: object
    # NO default - Consumer must provide this
    displayName: 'List of build check objects (required)'

steps:
  # The list itself
  - ${{ if not(startsWith(convertToJson(parameters.Checks), '[')) }}:
      - "Invalid Checks: must be a list of check objects, for example '- Check: TerraformFormat'. See: docs/user-docs/checks/README.md": "Error"
  - ${{ else }}:
      - ${{ each check in parameters.Checks }}:
          # The entry must be an object
          - ${{ if not(startsWith(convertToJson(check), '{')) }}:
              - ? "Invalid Checks: each entry must be an object with a 'Check' field, for example '- Check: TerraformFormat'. See: docs/user-docs/checks/README.md"
                : "Error"
          - ${{ else }}:

              # Check: required
              - ${{ if or(not(check.Check), eq(check.Check, '')) }}:
                  - "Invalid Checks: entry is missing required field 'Check'. Supported: TerraformFormat, SnykIac. See: docs/user-docs/checks/README.md": "Error"

              # Check: must be a string, not an object or list
              - ${{ elseif or(startsWith(convertToJson(check.Check), '{'), startsWith(convertToJson(check.Check), '[')) }}:
                  - "Invalid Checks: 'Check' must be a string. Supported: TerraformFormat, SnykIac. See: docs/user-docs/checks/README.md": "Error"

              # Check: must be supported by this build job
              - ${{ elseif notIn(check.Check, 'TerraformFormat', 'SnykIac') }}:
                  - ? "Invalid Checks: '${{ check.Check }}' is not a supported check for terraform_build. Supported: TerraformFormat, SnykIac. See: docs/user-docs/checks/README.md"
                    : "Error"

              # Check listed more than once: every entry for it needs a Name
              - ? ${{ elseif and(not(contains(convertToJson(check), '"Name":')), gt(length(split(lower(convertToJson(parameters.Checks)), lower(format('"Check":{0}"{1}"', ' ', check.Check)))), 2)) }}
                : - ? "Invalid Checks: '${{ check.Check }}' is listed more than once, so every '${{ check.Check }}' entry needs a unique 'Name'. See: docs/user-docs/checks/README.md"
                    : "Error"

              # Name: optional, so only validated when provided
              - ${{ if contains(convertToJson(check), '"Name":') }}:

                  # Name: must be a string, not an object or list
                  - ${{ if or(startsWith(convertToJson(check.Name), '{'), startsWith(convertToJson(check.Name), '[')) }}:
                      - "Invalid Checks: 'Name' must be a string. See: docs/user-docs/checks/README.md": "Error"

                  # Name: must not be empty
                  - ${{ elseif eq(check.Name, '') }}:
                      - "Invalid Checks: 'Name' must be a non-empty string when provided. See: docs/user-docs/checks/README.md": "Error"

                  # Name: must be unique across the whole Checks list
                  - ${{ elseif gt(length(split(lower(convertToJson(parameters.Checks)), lower(format('"Name":{0}"{1}"', ' ', check.Name)))), 2) }}:
                      - ? "Invalid Checks: the Name '${{ check.Name }}' is used by more than one entry. Each 'Name' must be unique. See: docs/user-docs/checks/README.md"
                        : "Error"
